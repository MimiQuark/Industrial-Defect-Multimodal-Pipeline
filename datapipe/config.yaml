# datapipe 数据管线配置
# 所有路径相对于项目根目录

paths:
  # MVTec AD 数据集根目录（管线 A 输入）。
  # 仓库内不含真实 MVTec AD；演示使用 make_demo_dataset.py 生成的合成 demo 数据集。
  dataset_root: datasets/demo_mvtec_synthetic
  # 管线 B 输入：GAN 生成图像目录（演示用 make_demo_dataset.py 生成的模拟产出）
  generated_root: datapipe/demo_generated
  # 管线 B 参考分布（真实/正常图像，用于启发式降级的分布对比）
  reference_root: datasets/demo_mvtec_synthetic
  # 版本化产出目录
  versions_dir: datapipe/versions
  # 报告输出目录
  reports_dir: datapipe/reports
  # GAN checkpoint 目录（当前仓库不含权重，管线 B 会如实记录其状态）
  checkpoints_dir: checkpoints

seed: 42

# 感知哈希去重
dedup:
  hash_size: 8            # dHash 位宽（8 -> 64 位）
  hamming_threshold: 5    # 汉明距离 <= 阈值视为重复

# JSONL 格式校验
validation:
  required_fields: [image, instruction, response]
  consistency_check: true  # 校验 response 与结构化标注的一致性（缺陷类型字符串出现）

# VLM（OpenAI 兼容接口）配置
# 默认指向阿里云 DashScope 兼容模式；通过环境变量 DASHSCOPE_API_KEY
# 或 OPENAI_API_KEY 提供密钥。未配置密钥时自动降级为确定性模板/启发式实现。
vlm:
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen3-vl-plus
  api_key_env: DASHSCOPE_API_KEY   # 读取 API key 的环境变量名（回退 OPENAI_API_KEY）
  timeout: 60                      # 单次请求超时（秒）
  concurrency: 4                   # 并发请求数
  enable_vlm: true                 # false 时强制使用降级实现

# 管线 B 打分阈值（各维度 1-5 分，取三维均值 < 阈值则过滤）
scoring:
  filter_threshold: 3.0
  # 启发式降级：与参考分布特征差异超过该倍数标准差则扣分
  heuristic_z_full_score: 1.0
